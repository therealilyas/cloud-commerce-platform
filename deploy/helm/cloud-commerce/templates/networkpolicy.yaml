apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: commerce-default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: commerce-allow-internal
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/part-of: cloud-commerce }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/part-of: cloud-commerce }
